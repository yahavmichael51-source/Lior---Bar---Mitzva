# One-click deploy on Render (https://render.com): New → Blueprint → pick this repo.
services:
  - type: web
    name: lior-bar-mitzva-rsvp
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        sync: false   # Render will ask you to type it when creating the service
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false   # paste the Postgres connection string (e.g. from Neon)
